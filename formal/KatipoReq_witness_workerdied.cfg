\* WITNESS: port death mid-flight reaches the caller as a worker_died error
\* via terminate/2. EXPECTED: VIOLATION of NoWorkerDied.
SPECIFICATION Spec
CONSTANTS
    NumReqs = 1
    MaxChunks = 2
    MaxGrants = 2
    PortCanDie = TRUE
    CallerCancels = FALSE
    StreamChoices <- BothStream
    WindowChoices <- WinAll
    SkipStaleCheck = FALSE
    NoTerminateNotify = FALSE
    TrackWitnesses = TRUE
INVARIANTS
    NoWorkerDied
CHECK_DEADLOCK FALSE

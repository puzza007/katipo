\* Same question as KatipoReq_safety1.cfg, asked across two concurrent
\* requests with trimmed chunk/grant depth, for cross-request interference.
\* EXPECTED: pass.
SPECIFICATION Spec
CONSTANTS
    NumReqs = 2
    MaxChunks = 1
    MaxGrants = 1
    PortCanDie = TRUE
    CallerCancels = TRUE
    StreamChoices <- BothStream
    WindowChoices <- WinAll
    SkipStaleCheck = FALSE
    NoTerminateNotify = FALSE
    TrackWitnesses = FALSE
INVARIANTS
    TypeOK
    AtMostOneTerminal
    InflightMeansUnresolved
    AdmitFailedSilent
    AliasDiscipline
    WindowBound
CHECK_DEADLOCK FALSE

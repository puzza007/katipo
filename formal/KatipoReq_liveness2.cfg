\* Same question as KatipoReq_liveness.cfg, asked across two concurrent
\* requests with trimmed chunk/grant depth, for cross-request interference.
\* Cancel is off: cancellation's liveness exemption is covered by the
\* one-request config, and disabling it keeps the liveness graph in memory.
\* EXPECTED: pass.
SPECIFICATION Spec
CONSTANTS
    NumReqs = 2
    MaxChunks = 1
    MaxGrants = 1
    PortCanDie = TRUE
    CallerCancels = FALSE
    StreamChoices <- BothStream
    WindowChoices <- WinAll
    SkipStaleCheck = FALSE
    NoTerminateNotify = FALSE
    TrackWitnesses = FALSE
PROPERTIES
    EventuallyResolved
CHECK_DEADLOCK FALSE

\* QUESTION: is it safe for spillover's catch-all to treat a worker that
\* died with the call in flight like any other miss and try the next one?
\* EXPECTED: NoDoubleSend VIOLATED -- that worker's handle_call may already
\* have run send_to_port, so the same non-idempotent request goes out
\* twice. This is what separates `noproc' (nothing sent, re-offer freely)
\* from `worker_died' (may be on the wire, stop).
SPECIFICATION Spec
CONSTANTS
    NumWorkers = 3
    MaxWaits = 1
    ReOfferOnDeath = TRUE
    LabelFromFirstPick = FALSE
    SharedDeadline = TRUE
INVARIANTS
    NoDoubleSend
CHECK_DEADLOCK FALSE

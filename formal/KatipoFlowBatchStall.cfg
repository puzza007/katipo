\* Sabotage/witness: a consumer that waits for more owed credits than the
\* window holds (GrantBatch > W) stalls the transfer forever -- only the
\* request timer can end it. Expected: VIOLATED (EventuallyDone). This is
\* why update_flow/3 docs recommend granting at most the window size.
SPECIFICATION Spec
CONSTANTS
  W = 2
  Total = 4
  GrantBatch = 3
  TimeoutsOn = FALSE
  CancelOn = FALSE
  FailuresOn = FALSE
  PortDeathsOn = FALSE
  KillsOn = FALSE
  ClearPausedFirst = TRUE
  LimitOn = FALSE
  CompleteOnFail = TRUE
PROPERTIES
  EventuallyDone

\* QUESTION: does the deadline-check fix stop the worker from registering a
\* request whose caller has already timed out?
\* EXPECTED: pass - the fix closes the late-admission window.
SPECIFICATION Spec
CONSTANTS
    DeadlineCheck = TRUE
    CallerFinishesOnTimeout = TRUE
    Idempotent = TRUE
    WorkerEndsOnRefusal = TRUE
INVARIANTS
    TypeOK
    NoLateAdmit
CHECK_DEADLOCK FALSE

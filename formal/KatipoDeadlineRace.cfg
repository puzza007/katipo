\* Question: what does the admission deadline rest on?
\* Expected: VIOLATED. Without ReplyWithinSlack the caller's timer may fire
\* between the worker's post-check and its reply, so a request admitted
\* just before its deadline is reported to the caller as admission_timeout.
\* This is the residual window the ?ADMISSION_SLACK margin covers.
SPECIFICATION Spec
CONSTANTS
  Refs = {r1, r2}
  MaxPortDeaths = 2
  MaxChunks = 1
  CallerTimeouts = TRUE
  DeadlineCheck = TRUE
  ReplyWithinSlack = FALSE
INVARIANTS
  TypeOK
  AtMostOneDelivery
  NoDeliveryAfterEffectiveCancel
  NoCancelPollution
  NoProgressAfterStop
  NoMessageAfterAdmissionError
  NoOrphanTransfer
PROPERTIES
  EventualOutcome

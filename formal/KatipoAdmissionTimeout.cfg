\* Question: does the bounded admission call (#185) as shipped keep the
\* "an error return means no message" contract?
\* Expected: VIOLATED (AtMostOneDelivery / NoMessageAfterAdmissionError).
\* The caller times out while its async_req is still queued; the worker
\* later admits it and the request timer (or the response) delivers a
\* second terminal outcome. Reproduced on the real code by
\* katipo_async_failure_SUITE:no_message_after_admission_timeout (pre-fix).
SPECIFICATION Spec
CONSTANTS
  Refs = {r1, r2}
  MaxPortDeaths = 2
  MaxChunks = 1
  CallerTimeouts = TRUE
  DeadlineCheck = FALSE
  ReplyWithinSlack = TRUE
INVARIANTS
  TypeOK
  AtMostOneDelivery
  NoDeliveryAfterEffectiveCancel
  NoCancelPollution
  NoProgressAfterStop
  NoMessageAfterAdmissionError
  NoOrphanTransfer
PROPERTIES
  EventualOutcome

\* QUESTION: is the worker's end-span-on-refusal load-bearing, or does
\* simply taking the finish away from the caller suffice?
\* EXPECTED: NoSpanLeak VIOLATED -- when the worker refuses the expired
\* admission nobody closes the span. Proves both halves of the ownership
\* change are needed.
SPECIFICATION Spec
CONSTANTS
    DeadlineCheck = TRUE
    CallerFinishesOnTimeout = FALSE
    Idempotent = TRUE
    WorkerEndsOnRefusal = FALSE
INVARIANTS
    NoSpanLeak
CHECK_DEADLOCK FALSE

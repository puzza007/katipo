\* QUESTION: does making the finish idempotent -- and changing nothing else
\* -- actually fix it? This is the first cut of the fix: one claim wins.
\* EXPECTED: NoFabricatedOutcome VIOLATED. Exactly-once now holds, but the
\* caller wins the claim for a request that DID run, so the surviving
\* record is a fabricated admission_timeout and the worker's real outcome
\* is dropped. Counting finishes cannot see this; it is why the shipped fix
\* also had to move ownership.
SPECIFICATION Spec
CONSTANTS
    DeadlineCheck = TRUE
    CallerFinishesOnTimeout = TRUE
    Idempotent = TRUE
    WorkerEndsOnRefusal = FALSE
INVARIANTS
    SpanExactlyOnceAtEnd
    NoFabricatedOutcome
CHECK_DEADLOCK FALSE

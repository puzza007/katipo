\* SABOTAGE (model mutation-test): remove terminate/2's worker_died
\* notification (notify_worker_died in katipo_worker.erl). EXPECTED: liveness
\* VIOLATION - the port dies, the worker exits without notifying, the pending
\* timer message dies with the worker, and the accepted request never

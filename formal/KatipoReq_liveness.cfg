\* QUESTION: does every accepted request eventually produce exactly one
\* terminal message, even when the network stalls forever (request timer), the
\* consumer never grants credits (timer keeps running while paused), or the
\* port dies (terminate/2 notifies worker_died)? Cancelled requests are exempt
\* by contract.
\* EXPECTED: pass, resting on WF of worker, port and timers only - the caller
\* is unfair, so "consumer walked away" schedules are all explored.
\* One request at full depth; liveness is per-request, and the trimmed
\* two-request variant (_liveness2) covers cross-request interference.
SPECIFICATION Spec
CONSTANTS
    NumReqs = 1
    MaxChunks = 2
    MaxGrants = 2
    PortCanDie = TRUE
    CallerCancels = TRUE
    StreamChoices <- BothStream
    WindowChoices <- WinAll
    SkipStaleCheck = FALSE
    NoTerminateNotify = FALSE
    TrackWitnesses = FALSE
PROPERTIES
    EventuallyResolved
CHECK_DEADLOCK FALSE

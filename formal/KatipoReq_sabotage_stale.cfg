\* SABOTAGE (model mutation-test): remove the worker's Reqs-membership check
\* before delivering port messages (forward_progress/finish_req in
\* katipo_worker.erl). EXPECTED: VIOLATION - a second terminal for a resolved
\* request (AtMostOneTerminal) and/or a chunk after a terminal (caller
\* assertion). If this config passes, the safety invariants are too weak.
SPECIFICATION Spec
CONSTANTS
    NumReqs = 1
    MaxChunks = 2
    MaxGrants = 2
    PortCanDie = FALSE
    CallerCancels = TRUE
    StreamChoices <- BothStream
    WindowChoices <- WinAll
    SkipStaleCheck = TRUE
    NoTerminateNotify = FALSE
    TrackWitnesses = FALSE
INVARIANTS
    AtMostOneTerminal
CHECK_DEADLOCK FALSE

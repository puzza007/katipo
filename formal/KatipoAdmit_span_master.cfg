\* QUESTION: before any span fix -- caller finishes on every error return,
\* no idempotency -- is the observation recorded exactly once?
\* EXPECTED: SpanExactlyOnceAtEnd VIOLATED: in the residual reply race the
\* worker admits, the caller times out, and both finish the same Obs, so
\* katipo_metrics:notify counts the request twice.
SPECIFICATION Spec
CONSTANTS
    DeadlineCheck = TRUE
    CallerFinishesOnTimeout = TRUE
    Idempotent = FALSE
    WorkerEndsOnRefusal = FALSE
INVARIANTS
    SpanExactlyOnceAtEnd
CHECK_DEADLOCK FALSE

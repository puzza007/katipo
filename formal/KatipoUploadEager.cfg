  Total = 2
  W = 1
  Resp = 2
  Length = FALSE
  MaskedResume = TRUE
  DemandGuard = TRUE
  EarlyDemand = FALSE
  Eager = TRUE
  Liar = FALSE
  RespEarly = TRUE
  TimeoutsOn = TRUE
  CancelOn = TRUE
  FailuresOn = TRUE
INVARIANTS
  BodyConserved
  CompleteBody
  OneChunkInFlight

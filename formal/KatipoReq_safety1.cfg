\* QUESTION: with everything enabled (streaming and buffered requests, cancel,
\* flow control, port death), do the safety claims hold - exactly-once terminal
\* delivery, the Reqs/alias discipline, window accounting, and the message
\* ordering contract (asserted inline in the caller's receive step)?
\* EXPECTED: pass.  One request at full depth. The worker's take-from-Reqs-then-deliver discipline and the
\* per-sender FIFO channels are what carry it.
SPECIFICATION Spec
CONSTANTS
    NumReqs = 1
    MaxChunks = 2
    MaxGrants = 2
    PortCanDie = TRUE
    CallerCancels = TRUE
    StreamChoices <- BothStream
    WindowChoices <- WinAll
    SkipStaleCheck = FALSE
    NoTerminateNotify = FALSE
    TrackWitnesses = FALSE
INVARIANTS
    TypeOK
    AtMostOneTerminal
    InflightMeansUnresolved
    AdmitFailedSilent
    AliasDiscipline
    WindowBound
CHECK_DEADLOCK FALSE

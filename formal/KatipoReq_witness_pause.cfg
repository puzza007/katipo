\* WITNESS: a bounded-window stream can exhaust credits, pause, resume on an
\* update_flow grant, and still complete with katipo_done. EXPECTED: VIOLATION
\* of NoPausedDone - the trace walks the whole backpressure round trip.
SPECIFICATION Spec
CONSTANTS
    NumReqs = 1
    MaxChunks = 2
    MaxGrants = 2
    PortCanDie = FALSE
    CallerCancels = FALSE
    StreamChoices <- StreamOnly
    WindowChoices <- WinBounded
    SkipStaleCheck = FALSE
    NoTerminateNotify = FALSE
    TrackWitnesses = TRUE
INVARIANTS
    NoPausedDone
CHECK_DEADLOCK FALSE

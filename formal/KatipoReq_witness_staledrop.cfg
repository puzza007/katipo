\* WITNESS: the stale-message drop path actually runs - a late port message
\* (or a timeout that lost the cancel_timer race) arrives for an
\* already-resolved request and is silently dropped. EXPECTED: VIOLATION of
\* NoStaleDrops. This is the state the exactly-once discipline exists for.
SPECIFICATION Spec
CONSTANTS
    NumReqs = 1
    MaxChunks = 2
    MaxGrants = 2
    PortCanDie = FALSE
    CallerCancels = TRUE
    StreamChoices <- BothStream
    WindowChoices <- WinAll
    SkipStaleCheck = FALSE
    NoTerminateNotify = FALSE
    TrackWitnesses = TRUE
INVARIANTS
    NoStaleDrops
CHECK_DEADLOCK FALSE

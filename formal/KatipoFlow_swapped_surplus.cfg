\* QUESTION: is the swapped-order defect a hard deadlock or a credit leak?
\* One surplus grant (MaxGrants = 2 for the same 2-chunk body): the second
\* grant re-resumes the re-paused transfer, which now sees the first
\* grant's late credit.
\* EXPECTED: pass - each pause eats one credit, so surplus credits recover.
\* In the full system the leak surfaces as spurious operation_timedout on
\* windowed streams whose consumers grant exact credit counts.
SPECIFICATION Spec
CONSTANTS
    MaxChunks = 2
    StreamWindow = 1
    MaxGrants = 2
    CreditsFirst = FALSE
PROPERTIES
    EventuallyDone
CHECK_DEADLOCK FALSE

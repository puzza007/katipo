\* WITNESS for the cost of sharing one deadline across the walk: a first
\* pick that answers {overload, _} just inside the bound spends the whole
\* admission budget, so the spillover walk never runs and the caller gets
\* admission_timeout with free workers untried. A fresh bound per hop would
\* have found one -- at up to NumWorkers x ?ADMISSION_TIMEOUT, which is the
\* worse failure. Recorded here so the trade is explicit rather than
\* discovered later.
\* EXPECTED: violated.
SPECIFICATION Spec
CONSTANTS
    NumWorkers = 3
    MaxWaits = 1
    ReOfferOnDeath = FALSE
    LabelFromFirstPick = FALSE
    SharedDeadline = TRUE
INVARIANTS
    NeverStarvesWalk
CHECK_DEADLOCK FALSE

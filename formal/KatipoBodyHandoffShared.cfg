\* Mutation: the output references the body without taking it over (as
\* evbuffer_add_reference with no cleanup, or a move that leaves conn->body
\* holding the bytes), so free_conn frees it while libevent still holds it.
\* Expected: NoUseAfterFree (or NoDoubleFree) VIOLATED.
SPECIFICATION Spec
CONSTANTS
  Buffered = {b1, b2}
  Streams = {s1}
  ZeroCopy = TRUE
  HandOver = FALSE
  AtomicFrame = TRUE
INVARIANTS
  TypeOK
  NoDoubleFree
  NoUseAfterFree
  NoLeak
  WholeFrames

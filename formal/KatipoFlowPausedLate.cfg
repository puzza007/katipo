\* Sabotage: flow_conn clearing `paused` AFTER curl_easy_pause(CONT)
\* instead of before. A write_cb re-pause raised inside the call is then
\* overwritten, katipo believes the transfer is running, and no later
\* grant ever resumes it. Expected: VIOLATED (PausedAgrees, then
\* EventuallyDone). Shows the ordering comment in flow_conn is load-bearing.
SPECIFICATION Spec
CONSTANTS
  W = 2
  Total = 5
  GrantBatch = 1
  TimeoutsOn = FALSE
  CancelOn = FALSE
  FailuresOn = FALSE
  PortDeathsOn = FALSE
  KillsOn = FALSE
  ClearPausedFirst = FALSE
INVARIANTS
  PausedAgrees
PROPERTIES
  EventuallyDone

\* QUESTION: can the exhaustion error be taken from whatever the first
\* random pick happened to be?
\* EXPECTED: LabelHonest VIOLATED -- a first pick that was merely
\* restarting reports `worker_died' for a pool whose other workers answered
\* as alive and full, so a saturated pool is announced as a dead one.
SPECIFICATION Spec
CONSTANTS
    NumWorkers = 3
    MaxWaits = 1
    ReOfferOnDeath = FALSE
    LabelFromFirstPick = TRUE
    SharedDeadline = TRUE
INVARIANTS
    LabelHonest
CHECK_DEADLOCK FALSE

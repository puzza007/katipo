\* QUESTION: the design as shipped -- idempotent claim, the caller finishes
\* nothing on an admission_timeout, and the worker ends the span when it
\* refuses an expired admission. Exactly once, never fabricated, real
\* outcome preserved, no leak?
\* EXPECTED: passes. This is the config that backs the CHANGELOG claim.
SPECIFICATION Spec
CONSTANTS
    DeadlineCheck = TRUE
    CallerFinishesOnTimeout = FALSE
    Idempotent = TRUE
    WorkerEndsOnRefusal = TRUE
INVARIANTS
    TypeOK
    SpanExactlyOnceAtEnd
    NoSpanLeak
    NoFabricatedOutcome
    RealOutcomeRecorded
CHECK_DEADLOCK FALSE

\* QUESTION: with a fresh deadline stamped per candidate, is admission
\* still bounded by one ?ADMISSION_TIMEOUT?
\* EXPECTED: WaitsBounded VIOLATED -- every worker can answer just inside
\* its own fresh bound, so the caller waits NumWorkers x ?ADMISSION_TIMEOUT
\* (witnessed by _witness_allwaits). Sharing one deadline is what makes the
\* documented 5s admission bound true.
SPECIFICATION Spec
CONSTANTS
    NumWorkers = 3
    MaxWaits = 1
    ReOfferOnDeath = FALSE
    LabelFromFirstPick = FALSE
    SharedDeadline = FALSE
INVARIANTS
    WaitsBounded
CHECK_DEADLOCK FALSE

\* Safety only, one more port death than KatipoFixed.cfg, using symmetry
\* over the interchangeable Refs (sound for invariants, not for liveness).
\* Lean (formal/lean, KatipoProofs.Admission) proves these invariants for
\* any number of refs and deaths; this run cross-checks the bigger instance
\* against the unabstracted TLA+ model.
\* Expected: no error (run with -deadlock).
SPECIFICATION Spec
CONSTANTS
  Refs = {r1, r2}
  MaxPortDeaths = 2
  MaxChunks = 1
  CallerTimeouts = TRUE
  DeadlineCheck = TRUE
  ReplyWithinSlack = TRUE
SYMMETRY RefPerms
INVARIANTS
  TypeOK
  AtMostOneDelivery
  NoDeliveryAfterEffectiveCancel
  NoCancelPollution
  NoProgressAfterStop
  NoMessageAfterAdmissionError
  NoOrphanTransfer

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Erlang/OTP ${{matrix.otp}} / rebar3 ${{matrix.rebar3}}
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
        rebar3: ['3.28.0']

    steps:
      - uses: actions/checkout@v7

      - name: Start httpbin server
        run: |
          cd test/http3-httpbin
          # A registry can refuse a pull from a shared runner now and then;
          # retry rather than fail the job before any test runs.
          for i in 1 2 3 4 5; do docker compose up -d && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          # Wait until httpbin actually serves through Caddy. `curl -s` exits 0
          # on any response, including a 502 while the Python httpbin behind
          # Caddy is still starting, so gate on a real 200 to avoid a race.
          for i in {1..30}; do
            code=$(curl -k -s -o /dev/null -w '%{http_code}' https://localhost:8443/get || true)
            [ "$code" = "200" ] && break
            echo "Waiting for httpbin (got $code)..."
            sleep 2
          done

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          rebar3-version: ${{matrix.rebar3}}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc libevent-dev libcurl4-openssl-dev libssl-dev lcov

      - name: Run tests with coverage
        env:
          COVERAGE: 1
        run: rebar3 ct --cover

      - name: Generate Erlang coverage report
        run: rebar3 covertool generate

      - name: Generate C coverage report
        run: |
          cd c_src
          lcov --capture --directory . --output-file coverage.info
          # Remove system headers from coverage
          lcov --remove coverage.info '/usr/*' --output-file coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./_build/test/covertool/katipo.covertool.xml,./c_src/coverage.info
          flags: erlang,c
          disable_search: true
          fail_ci_if_error: false

      - name: Compile the shipped build with warnings as errors
        # Tests run with trace hooks on (KATIPO_TRACE); this catches warnings
        # that only the build users get can show. Runs after the coverage
        # steps so the C port they measure is the instrumented build.
        run: rebar3 as strict compile

      - name: Run dialyzer
        run: rebar3 dialyzer

      - name: Run xref
        run: rebar3 xref

      - name: Run lint
        run: rebar3 lint

      # CI keeps nothing else from a failed or hung run, and an intermittent
      # failure cannot be rerun locally to see what the test and the test
      # servers saw.
      - &save-server-logs
        name: Save the test servers' logs
        if: failure() || cancelled()
        run: |
          mkdir -p _build/test/logs
          (cd test/http3-httpbin && docker compose logs --no-color --timestamps) \
            > _build/test/logs/test-servers.log 2>&1 || true

      - &upload-ct-logs
        name: Upload Common Test logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ct-logs-${{ github.job }}-${{ strategy.job-index }}
          path: _build/test/logs
          retention-days: 14

      - name: Stop httpbin server
        if: always()
        run: |
          cd test/http3-httpbin
          docker compose down

  test-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: AddressSanitizer
    strategy:
      matrix:
        otp: ['27']
        rebar3: ['3.28.0']

    steps:
      - uses: actions/checkout@v7

      - name: Start httpbin server
        run: |
          cd test/http3-httpbin
          # A registry can refuse a pull from a shared runner now and then;
          # retry rather than fail the job before any test runs.
          for i in 1 2 3 4 5; do docker compose up -d && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          # Wait until httpbin actually serves through Caddy. `curl -s` exits 0
          # on any response, including a 502 while the Python httpbin behind
          # Caddy is still starting, so gate on a real 200 to avoid a race.
          for i in {1..30}; do
            code=$(curl -k -s -o /dev/null -w '%{http_code}' https://localhost:8443/get || true)
            [ "$code" = "200" ] && break
            echo "Waiting for httpbin (got $code)..."
            sleep 2
          done

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          rebar3-version: ${{matrix.rebar3}}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc libevent-dev libcurl4-openssl-dev libssl-dev

      - name: Run tests under AddressSanitizer
        env:
          # Build the C port with -fsanitize=address (see c_src/Makefile).
          # rebar3's compile pre-hook runs `make -C c_src`, which picks this up.
          SANITIZE: 1
          # halt_on_error: abort the port on any use-after-free/overflow/double-free.
          # detect_leaks: LeakSanitizer runs at port exit -- the port process calls
          # exit()/errx(), so atexit handlers fire and leaks are reported.
          # log_path: ASan/LSan errors in the BEAM-spawned port don't fail rebar3
          # directly (the port is a child process), so route them to files we can
          # check after the run instead of relying on the exit code.
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:log_path=${{ github.workspace }}/asan_log
          # print_suppressions=0: LeakSanitizer otherwise writes a table of the
          # suppressions that matched even when every leak was suppressed, and
          # the check below fails on any log. Ubuntu's libcurl 8.5 leaks after
          # a chunked response with trailers (a known curl bug, fixed upstream
          # in a later refactor; curl.se/mail/distros-2025-07/0001.html), so
          # that table appears whenever the trailer tests run. Unsuppressed
          # leaks and memory errors still write a log and fail the job.
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/lsan.suppressions:print_suppressions=0
        run: |
          rebar3 ct
          # A clean run (no unsuppressed leaks/errors) writes nothing; any
          # asan_log.<pid> file means the sanitizer flagged something.
          if ls "${{ github.workspace }}"/asan_log.* >/dev/null 2>&1; then
            echo "::error::AddressSanitizer/LeakSanitizer reported errors:"
            cat "${{ github.workspace }}"/asan_log.*
            exit 1
          fi
          echo "AddressSanitizer clean."

      - *save-server-logs

      - *upload-ct-logs

      - name: Stop httpbin server
        if: always()
        run: |
          cd test/http3-httpbin
          docker compose down

  test-http3:
    runs-on: ubuntu-latest
    # Building curl with HTTP/3 support on a cache miss takes most of this.
    timeout-minutes: 45
    name: HTTP/3 Tests (${{ matrix.curl }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current curl, on OpenSSL's own QUIC API.
          - curl: curl-8_23_0
            openssl_repo: https://github.com/openssl/openssl.git
            openssl: openssl-3.5.9
            nghttp3: v1.18.0
            ngtcp2: v1.25.0
          # curl 8.10.0-8.11.0 keep the timer deadline they reported, the
          # one range where the C port's timer re-arm is needed
          # (formal/KatipoTimerOld811.cfg). It predates OpenSSL's QUIC API,
          # so it builds quictls and the ngtcp2 and nghttp3 of its day.
          - curl: curl-8_11_0
            openssl_repo: https://github.com/quictls/openssl.git
            openssl: openssl-3.1.4+quic
            nghttp3: v1.6.0
            ngtcp2: v1.8.1
    env:
      OPENSSL_REPO: ${{ matrix.openssl_repo }}
      OPENSSL_TAG: ${{ matrix.openssl }}
      NGHTTP3_TAG: ${{ matrix.nghttp3 }}
      NGTCP2_TAG: ${{ matrix.ngtcp2 }}
      CURL_TAG: ${{ matrix.curl }}
      CURL_PREFIX: /tmp/curl-http3/install

    steps:
      - uses: actions/checkout@v7

      - name: Start HTTP/3 httpbin server
        run: |
          cd test/http3-httpbin
          # A registry can refuse a pull from a shared runner now and then;
          # retry rather than fail the job before any test runs.
          for i in 1 2 3 4 5; do docker compose up -d && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          # Wait until httpbin actually serves through Caddy. `curl -s` exits 0
          # on any response, including a 502 while the Python httpbin behind
          # Caddy is still starting, so gate on a real 200 to avoid a race.
          for i in {1..30}; do
            code=$(curl -k -s -o /dev/null -w '%{http_code}' https://localhost:8443/get || true)
            [ "$code" = "200" ] && break
            echo "Waiting for httpbin (got $code)..."
            sleep 2
          done

      - name: Cache curl HTTP/3 build
        uses: actions/cache@v6
        id: curl-cache
        with:
          path: ${{ env.CURL_PREFIX }}
          key: curl-http3-${{ env.CURL_TAG }}-${{ env.NGTCP2_TAG }}-${{ env.NGHTTP3_TAG }}-${{ env.OPENSSL_TAG }}-${{ runner.os }}

      - name: Build curl with HTTP/3 support
        if: steps.curl-cache.outputs.cache-hit != 'true'
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config autoconf libtool cmake libpsl-dev

          SRC=$(mktemp -d)
          cd "$SRC"
          PREFIX=$CURL_PREFIX
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig

          git clone --depth 1 -b "$OPENSSL_TAG" "$OPENSSL_REPO" openssl
          cd openssl
          ./config --prefix=$PREFIX --openssldir=$PREFIX/ssl --libdir=lib
          make -j$(nproc)
          make install_sw
          cd ..

          # Build nghttp3 (sfparse is built as a submodule)
          git clone --depth 1 --recursive -b "$NGHTTP3_TAG" https://github.com/ngtcp2/nghttp3.git
          cd nghttp3
          autoreconf -fi
          ./configure --prefix=$PREFIX --enable-lib-only
          make -j$(nproc)
          make install
          cd ..

          # Build ngtcp2
          git clone --depth 1 --recursive -b "$NGTCP2_TAG" https://github.com/ngtcp2/ngtcp2.git
          cd ngtcp2
          autoreconf -fi
          ./configure --prefix=$PREFIX --enable-lib-only --with-openssl \
            LDFLAGS="-Wl,-rpath,$PREFIX/lib"
          make -j$(nproc)
          make install
          cd ..

          # Build curl with HTTP/3
          git clone --depth 1 -b "$CURL_TAG" https://github.com/curl/curl.git
          cd curl
          autoreconf -fi
          ./configure --prefix=$PREFIX \
            --with-openssl=$PREFIX \
            --with-nghttp3=$PREFIX \
            --with-ngtcp2=$PREFIX \
            LDFLAGS="-Wl,-rpath,$PREFIX/lib"
          make -j$(nproc)
          make install
          cd ..

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.28.0'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc libevent-dev

      - name: Build and test with HTTP/3 curl
        env:
          KATIPO_TEST_HTTP3: "true"
          PKG_CONFIG_PATH: ${{ env.CURL_PREFIX }}/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ env.CURL_PREFIX }}/lib
        run: |
          # Add custom curl to PATH
          export PATH=$CURL_PREFIX/bin:$PATH

          # Verify HTTP/3 support
          curl --version | grep -i http3
          curl-config --vernum

          # Build and run tests
          rebar3 ct

      - *save-server-logs

      - *upload-ct-logs

      - name: Stop HTTP/3 server
        if: always()
        run: |
          cd test/http3-httpbin
          docker compose down
